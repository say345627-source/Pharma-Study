<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e9f0;--accent:#3867d6;--green:#16865b;--red:#c34848}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.75}
header{background:linear-gradient(125deg,#111827,#263d64);color:white;padding:30px 18px 26px}
.wrap{max-width:980px;margin:auto;padding:0 16px}header h1{margin:0;font-size:27px}header p{margin:5px 0 0;color:#d5deee}
main{padding:22px 0 60px}.panel,.subject,.study{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 5px 18px #17203308}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f7f9fd;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:23px}.muted{color:var(--muted);font-size:13px}
h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 5px}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:10px 14px;background:#edf2ff;color:#234caa;font-weight:700}
button.primary{background:var(--accent);color:#fff}button.good{background:#e6f6ef;color:#13734d}button.bad{background:#fff0f0;color:#a73737}button:disabled{opacity:.45;cursor:not-allowed}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.subject{margin:0;cursor:pointer;transition:.15s}.subject:hover{border-color:#9bb4ef;transform:translateY(-2px)}
.subject .count{font-size:12px;color:var(--muted)}.soon{opacity:.7;cursor:default}.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cardq{border:1px solid var(--line);border-radius:16px;padding:20px;background:#fbfcff;margin:14px 0}
.question{font-size:19px;font-weight:700;min-height:62px}.answer{display:none;border-top:1px solid var(--line);margin-top:15px;padding-top:13px;white-space:pre-wrap}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.bar{height:8px;background:#e9edf5;border-radius:9px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:var(--green);width:0}
.hidden{display:none!important}.empty{text-align:center;padding:24px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:520px){header h1{font-size:22px}.stats{gap:6px}.stat{padding:9px 4px}.stat b{font-size:19px}.panel,.subject,.study{padding:14px}}

<header><div class="wrap"><h1>منصة طلاب الصيدلة</h1><p>السنة الثانية · بطاقات سؤال وجواب للمراجعة</p></div></header>
<main class="wrap">
<section id="home">
<div class="panel"><h2>تقدّمك على هذا الجهاز</h2><div class="stats"><div class="stat"><b id="total">0</b><span class="muted">بطاقة تمت مراجعتها</span></div><div class="stat"><b id="known">0</b><span class="muted">عرفتها</span></div><div class="stat"><b id="wrong">0</b><span class="muted">تحتاج مراجعة</span></div></div><p class="muted">يُحفظ التقدم في المتصفح على جهازك فقط، ولا يتزامن تلقائياً بين الأجهزة.</p></div>

</section>

<div class="crumb"><button onclick="goHome()">← المواد</button><span id="crumb"></span></div>

</div></section>

<script>
const DATA=[
{id:"pharm",name:"الصيدلانيات 1",desc:"السواغات · ما قبل التركيبة · المساحيق · المحاليل والشرابات",cards:[
["ما علم الصيدلانيات (Pharmaceutics)؟","هو علم صياغة الشكل الصيدلاني (Formulation) على أفضل نحو، ويدرس أشكال الدواء ومراجعها ودساتيرها."],
["ما أمثلة الأشكال الصيدلانية التي يدرسها علم الصيدلانيات؟","المضغوطات (الأقراص)، الكبسولات، المراهم، الشرابات، التحاميل، المعلقات، والمستحضرات العقيمة."],
["مع أي علوم يتكامل علم الصيدلانيات؟","يتكامل مع علم العقاقير وعلم استقلاب المواد للتعرف إلى استخلاص المادة الدوائية وصناعتها ثم تحويلها إلى شكل صيدلاني."],
["ما مواصفات الشكل الصيدلاني الجيد؟","الثباتية، الفاعلية والتوافر الحيوي، الجاذبية، والمقبولية لدى المريض."],
["كيف تقارن ثباتية الأشكال الصلبة والسائلة وفق الملخص؟","الشكل الصلب أكثر ثباتاً من الشكل السائل، وتُعرف الثباتية بدراسة الثبات."],
["ما المقصود بمطاوعة المريض (Patient compliance)؟","مدى التزام المريض بالنظام العلاجي؛ وكلما انخفضت المطاوعة انخفضت الفاعلية العلاجية للمستحضر."],
["متى يوضع تاريخ الصلاحية للمستحضر؟","بعد دراسة الثباتية، عبر تعريض المستحضر لظروف مختلفة ومراقبته للتأكد من بقائه ثابتاً وفعالاً."],
["ما المقصود بالمادة الفعالة الدوائية API؟","Active Pharmaceutical Ingredient؛ وهي المادة المسؤولة عن التأثير الدوائي في المستحضر."],
["ما مصادر المادة الفعالة الطبيعية المذكورة؟","مصادر نباتية، وحيوانية، ومعدنية."],
["ما المثال النباتي المذكور لمصدر مادة فعالة؟","باكليتاكسيل (Paclitaxel/Taxol) من نبات التاكسوس، ويذكر الملخص استعماله لعلاج سرطان المبيض؛ ويختص علم العقاقير بالمصدر النباتي."],
["ما أمثلة المواد الفعالة ذات المصدر الحيواني؟","الأنسولين (ذُكر أنه استُخلص أولاً من البقر)، وهرمون النمو، وهرمونات الغدة الدرقية."],
["كيف تُحضّر المواد الفعالة ذات المصدر الصناعي؟","بتفاعل مواد كيميائية مع بعضها ضمن شروط معينة للحصول على مادة ذات تأثيرات دوائية؛ ويختص بذلك الكيمياء العضوية والكيمياء الصيدلية."],
["كيف صنّف الملخص المواد الدوائية بحسب طبيعتها الكيميائية ونسبها؟","حموض ضعيفة 20%، أسس ضعيفة 70%، ومواد متذبذبة 5% كما ورد في المحاضرة الأولى؛ النسب المذكورة لا تجمع إلى 100%."],
["ما صفة الحمض الضعيف في الوسط المائي؟","يكون مستعداً لتقديم بروتون."],
["ما صفة الأساس الضعيف بحسب الملخص؟","يحوي زوجاً إلكترونياً مستعداً لإجراء تفاعلات كيميائية، وغالباً يتضمن وظيفة أمينية."],
["ما أمثلة الأسس الضعيفة المذكورة؟","الأتروبين والمورفين."],
["ما الحالة الفيزيائية الأكثر شيوعاً للمادة الدوائية؟","الحالة الصلبة."],
["ما الذي يجب فعله قبل استخدام مسحوق في تحضير شكل صيدلاني؟","تصنيفه ودراسة خصائصه."],
["ما السواغات (Excipients)؟","مواد خاملة فارماكولوجياً، أي ليس لها تأثير دوائي، لكنها فعالة كيميائياً وتُضاف لإكمال الشكل الصيدلاني."],
["ما بعض وظائف السواغات؟","قد تكون محلية، مطرّية، منكّهة، أو مقنّعة للطعم السيئ."],
["هل يمكن أن تؤثر السواغات في الفعالية العلاجية؟","نعم؛ فقد تؤثر في التوافر الحيوي، وبالتالي قد تختلف الفعالية العلاجية بحسب السواغ المستخدم."],
["ما الشرط الأساسي عند اختيار السواغ؟","ألا يتفاعل مع المادة الفعالة تفاعلاً غير مرغوب، وأن يكون متوافقاً معها."],
["لماذا يجب دراسة التنافرات الدوائية للسواغ؟","لمعرفة المواد الدوائية التي قد يتفاعل معها السواغ وينتج عنها مادة ضارة."],
["ما الصيغة الأساسية للشكل الصيدلاني؟","الشكل الصيدلاني = المادة الفعالة (API) + السواغ المناسب (Excipient)."],
["كيف يوضح مسحوق الفوران أن السواغ قد يكون خاملاً فارماكولوجياً لكنه فعال كيميائياً؟","يحدث الفوران بتفاعل حمض مع أساس وانطلاق غاز CO₂؛ والفقاعات المرئية عند وضع القرص في الماء ناتجة عن انطلاق الغاز."],
["ما المثال المذكور لتفاعل السواغات في صيغة دوائية؟","تفاعل الكالسيوم مع حمض الطرطريك أو حمض الليمون."],
["ما المقصود بدراسات ما قبل التركيبة (Preformulation Study)؟","مرحلة مبكرة وحاسمة في تطوير الدواء لفهم الخواص الفيزيائية والكيميائية والبيولوجية للمادة الفعالة قبل اختيار السواغات وصياغة الشكل الصيدلاني."],
["ما الخصائص التي تتناولها دراسات ما قبل التركيبة؟","الذوبانية، الثباتية، الشكل البلوري، نقطة انصهار المواد الصلبة، التوافق مع السواغات، والخصائص البيولوجية."],
["لماذا تعد دراسات ما قبل التركيبة أساسية؟","لأنها تساعد على تصميم الشكل الصيدلاني المناسب مثل الأقراص والكبسولات والشراب والمعلقات."],
["ما الذي يحدد هوية المادة الصلبة وفق المحاضرة؟","تحديد نقطة انصهارها، وتُدرس أيضاً صفات مثل اللون والرائحة."],
["كيف وُصف الأسبرين في دستور الأدوية بحسب المحاضرة؟","مسحوق بلوري أبيض (White crystal powder)."],
["ماذا قد يدل ظهور رائحة نفاذة في الأسبرين؟","قد يدل على امتصاص الرطوبة وتخرب الأسبرين؛ إذ يتحلل إلى حمض الخل وحمض الصفصاف وفق شرح المحاضرة."],
["ما الأنماط البنيوية التي قد تظهر عند دراسة المادة تحت المجهر؟","بنية بلورية، أو عديمة الشكل (Amorphous)، أو متعددة الأشكال البلورية (Polymorphism)."],
["ما المقصود بتعدد الأشكال البلورية (Polymorphism)؟","وجود المادة نفسها بأكثر من شكل بلوري."],
["ما صفات المادة عديمة الشكل من حيث الانصهار والانحلال وفق المحاضرة الأولى؟","لا تملك نقطة انصهار محددة وثابتة، بل مجالاً واسعاً من درجات الحرارة، ويذكر ملف المحاضرة الأولى أن معدل انحلالها أعلى."],
["ما صفة المادة البلورية من حيث الانصهار؟","لها نقطة انصهار محددة."],
["ما أثر اختلاف الشكل البلوري للمادة نفسها؟","قد تتغير بعض الصفات الفيزيائية والكيميائية الفيزيائية مثل نقطة الانصهار والانحلال في الوسط المائي، رغم بقاء المادة الفعالة والبنية الكيميائية نفسها."],
["ما التقنية الأكثر دقة لكشف اختلاف البنية البلورية للمادة نفسها بحسب ملخص المساحيق؟","أشعة X (X-Ray)."],
["هل يختلف التأثير الفارماكولوجي بالضرورة بين الأشكال البلورية للمادة نفسها؟","يذكر الملخص أن التأثير الفارماكولوجي يبقى نفسه لأن المادة الفعالة نفسها، بينما قد تختلف بعض الصفات الفيزيوكيميائية."],
["ما الذي تدرسه دراسة أبعاد الجسيمات؟","تدرس حجم الجسيمات وتوزعها، وهو ما يؤثر في الانسيابية والانحلال والتصنيع والتجانس."],
["ما تصنيفات المساحيق بحسب حجم الجسيمات المذكورة في المحاضرة؟","خشنة جداً، خشنة، ناعمة، وفائقة النعومة."],
["ما المشكلة التصنيعية للمساحيق فائقة النعومة؟","قد تكون انسيابيتها ضعيفة وتحتاج إلى معالجة صيدلانية."],
["ما المشكلة التي قد تظهر في المساحيق الخشنة جداً؟","قد تحتاج إلى معالجة لتجنب مشكلة الانحلال."],
["لماذا تعد الانسيابية مهمة في المساحيق؟","لأن الانسيابية المنتظمة تساعد على تجانس المحتوى والوزن أثناء التصنيع والتعبئة."],
["كيف تؤثر خشونة المسحوق في انسيابيته وفق المحاضرة؟","تكون انسيابية المساحيق الخشنة أسهل وأكثر انتظاماً، بينما قد ترتبط الجسيمات الناعمة ببعضها وتعيق الانسياب."],
["ما أثر تفاوت أبعاد الجسيمات في تجانس المسحوق؟","قد يؤدي اختلاف الأبعاد إلى عدم تجانس التوزيع وبالتالي عدم تساوي كمية المادة الفعالة بين الوحدات."],
["ما الأدوات المذكورة لدراسة أبعاد المساحيق؟","المجهر المزود بمسطرة، المناخل، الميزان الحساس، الميزان الكهربائي/الإلكتروني، والميزان الميكانيكي."],
["ما وظيفة الهاون ويد الهاون؟","تحويل المسحوق من الحالة الخشنة إلى الناعمة ومزج مجموعة من المساحيق."],
["ما نوعا المناخل المذكوران واستعمال كل منهما؟","مناخل لتحضير الحثيرات، ومناخل لدراسة الأبعاد بدقة عالية وإجراء القياسات الدستورية."],
["كيف تجرى دراسة توزيع حجم المسحوق بالمناخل الهزازة وفق المحاضرة؟","توزن العينة وتوضع أعلى المناخل، ثم تُهز مدة محددة، وبعدها يُلاحظ توزع المسحوق على المناخل لتقدير أبعاده وتجانسه."],
["كيف فسرت المحاضرة تجانس المسحوق في اختبار المناخل؟","ذكرت أن توزع المسحوق على منخل محدد يدل على التجانس، أما توزعه على عدة مناخل فيدل على عدم التجانس."],
["ما الحثيرات (Granules)؟","أشكال صلبة غير منتظمة، وقد تُحضّر أحياناً لتكون كروية الشكل."],
["ما مجال أبعاد الحثيرات المذكور؟","بين المناخل ذات الأرقام 4–12، أي نحو 2–4.75 mm كما ورد في الملف."],
["ما فائدة تحويل المسحوق الناعم إلى حثيرات؟","يساعد ذلك على تحسين الانسيابية."],
["كيف تتم الطريقة الرطبة لتحضير الحثيرات؟","تُضاف مادة رابطة سائلة إلى المسحوق لتكوين عجينة طرية، ثم تُنخل وتُضغط عبر منخل التحثير، وتُجمع على صفيحة وتُجفف."],
["كيف تتأثر الحثيرات المحضرة من مساحيق ناعمة بنوع السواغ؟","يذكر الملف أن استعمال سواغات كارهة للماء قد يؤثر فيها، بينما لا تتأثر بالطريقة نفسها عند استعمال سواغات محبة للماء."],
["كيف يؤثر حجم الجسيمات في معدل الانحلال بحسب ملخص المساحيق؟","علاقة عكسية: صغر الأبعاد يزيد سطح التماس، فيزيد معدل الانحلال، وقد يزيد الامتصاص والتوافر الحيوي."],
["كيف يؤثر حجم الجسيمات في الانسيابية بحسب ملخص المساحيق؟","ذكر الملخص علاقة طردية بين أبعاد الجسيمات والانسيابية."],
["ما المقصود بالتجانس (Uniformity)؟","تجانس توزع المواد في الشكل الصيدلاني."],
["ما عاملان يؤثران سلباً في التجانس؟","تعدد أبعاد الجسيمات، وضعف الانسيابية الذي قد يؤدي إلى التكتل."],
["ما أهم خصائص المسحوق التي يجب دراستها وفق ملخص المساحيق؟","الشكلية، النقاوة، الانحلالية، الثباتية، أبعاد الجسيمات، الانسيابية، التجانس، والتوافق مع بقية مكونات الصيغة."],
["ما المقصود بدراسة الشكلية (Morphology Study)؟","تحديد ما إذا كان المسحوق عديم الشكل أو بلورياً أو متعدد الأشكال البلورية؛ لأن ذلك يؤثر في الانحلال والانسيابية والثبات والانصهار."],
["كيف يمكن تحديد نقاوة المادة وفق ملخص المساحيق؟","يذكر الملخص أن أسهل طريقة هي تحديد نقطة الانصهار، ويمكن أيضاً استخدام طرق المعايرة التي يحددها الدستور."],
["ما الأوساط المذكورة لدراسة انحلالية المواد؟","الماء، الإيثانول، الكلوروفورم، والأسيتون."],
["ما العوامل البيئية التي ينبغي الانتباه إليها عند دراسة الثباتية؟","الحرارة والرطوبة، مع تحديد العوامل المؤثرة وتجنب الظروف التي تسبب عدم الثبات."],
["ما الفرق بين الجزيء والجسيم بحسب الملخص؟","الجزيء أصغر مكونات المادة ويُرى بالمجهر؛ أما الجسيم فهو تجمع لعدة جزيئات ويمكن إدراكه بالحواس ورؤيته بالعين المجردة."],
["كيف تؤثر أشكال البلورات في الانسيابية بحسب جدول الملخص؟","الكروية: ممتازة؛ البيضوية: جيدة؛ الإبرية: سيئة بسبب تشابكها."],
["كيف تُدرس البنية البلورية للمسحوق تحت المجهر بحسب الملخص؟","توضع عينة على صفيحة زجاجية، ويضاف زيت الفازلين، ثم تغطى بساترة زجاجية رقيقة؛ ويُستدل على البنية البلورية بانعكاس الضوء."],
["ما موقف إدارة الغذاء والدواء الأمريكية FDA من الدواء الجديد؟","تراجع البيانات المقدمة عن المنتج ومكوناته وطرق التحليل ومعايير الجودة والتصنيع والدراسات ما قبل السريرية والسريرية قبل اعتماد التسويق."],
["ما الذي يجب على الشركة إثباته للحصول على موافقة تسويق دواء جديد؟","أن الدواء آمن وفعال، وأن عمليات الإنتاج والتصنيع والتعبئة ووضع الملصقات مضبوطة ومصادق عليها وتحقق معايير الجودة."],
["ما المصادر أو الطرق المذكورة للحصول على مادة كيميائية دوائية جديدة؟","التخليق العضوي، التعديل الجزئي، أو العزل من النباتات."],
["ما المقصود بالدراسات ما قبل السريرية؟","دراسات تجرى في المختبر أو على الخلايا أو الحيوانات قبل الانتقال إلى التجارب السريرية على البشر."],
["ما الجوانب التي تتناولها الدراسات الكيميائية قبل السريرية؟","البنية والوظائف الكيميائية، الوزن الجزيئي، الانحلالية، درجة الحموضة، ونقاط الانصهار والغليان."],
["ماذا تشمل الدراسات البيولوجية قبل السريرية بحسب الملخص؟","التأثيرات الفارماكولوجية وعلاقتها بالجرعة، وحرائك المادة داخل الجسم (ADME)، والتأثيرات السمية وعلاقتها بالجرعة على الحيوانات."],
["ما المقصود باختصار ADME؟","الامتصاص والتوزع والاستقلاب والإطراح."],
["ما الأطوار الثلاثة للتجارب السريرية؟","الطور الأول Phase I، ثم الثاني Phase II، ثم الثالث Phase III."],
["ما الهدف من الطور السريري الأول Phase I وفق المحاضرة؟","تقييم مأمونية الدواء؛ وذكرت المحاضرة عدداً تقريبياً 20–100 مشارك، وقد يكونون متطوعين أصحاء أو مرضى بحسب الحالة."],
["ما الهدف من الطور السريري الثاني Phase II وفق المحاضرة؟","تقييم فعالية الدواء على مرضى مصابين بالمرض، وذكرت المحاضرة عدداً يقارب 100."],
["ما الهدف من الطور السريري الثالث Phase III وفق المحاضرة؟","تأكيد المأمونية والفعالية وتحديد الجرعة الدقيقة، وذكرت المحاضرة عدداً تقريبياً 100–1000."],
["ما الذي يحدث بعد موافقة FDA وتسويق الدواء؟","تستمر متابعة الدواء ورصد الآثار الجانبية والمشكلات أو الاستطبابات الجديدة؛ وتسمى المتابعة بعد التسويق في المحاضرة Phase IIII."],
["ما وظيفة قسم التيقظ الدوائي بحسب المحاضرة؟","متابعة الدواء بعد تسويقه، ورصد وتحليل وتقييم الآثار الجانبية والمشكلات، وتلقي البلاغات من الأفراد والمؤسسات الصحية والشركات واتخاذ الإجراءات اللازمة."],
["ما مثال المحاضرة على أهمية متابعة الدواء بعد التسويق؟","ملاحظة تشوهات الأجنة بعد طرح الثاليدوميد، وظهور النعاس مع بعض مضادات الحساسية أثناء القيادة، وملاحظة مخاطر لبعض مضادات الالتهاب."],
["ما المقصود بالعلاج الجيني؟","أسلوب طبي يعتمد على تعديل المادة الوراثية (الجينية) للخلايا الحية."],
["ما فائدة الهندسة الوراثية في الصناعة الدوائية بحسب المحاضرة؟","قد تتيح الحصول على مضادات حيوية ولقاحات أكثر نقاءً عبر التلاعب بالمادة الوراثية."],
["ما أمثلة البروتينات التي قد تنتجها البكتيريا بعد نقل مادة وراثية إليها؟","الأنسولين، هرمون النمو البشري، ولقاح التهاب الكبد B كما ورد في المحاضرة."],
["هل يمكن تعديل الخلايا خارج الجسم أو داخله في العلاج الجيني؟","نعم، يذكر النص إمكان تعديل الخلايا خارج الجسم أو داخله."],
["ما الحالة التي ذكرها الملف كأول استعمال للعلاج الجيني البشري؟","نقص إنزيم الأدينوزين دي أميناز (ADA)، الذي يؤدي إلى خلل في وظيفة الجهاز المناعي."],
["ما مأساة إكسير السلفانيلاميد؟","في عام 1938 كانت انحلالية السلفانيلاميد ضعيفة في الماء، فحُضّر إكسير بمذيب ثنائي إيثيلين غليكول؛ وحدثت وفيات بالتسمم تجاوزت 100 حالة قبل سحب المنتج."],
["ما الدرس المستفاد من مأساة إكسير السلفانيلاميد؟","ضرورة التأكد من المواد الداخلة في تركيب الدواء وإجراء الاختبارات الدوائية والسمية على المادة الفعالة والسواغات والمنتج النهائي."],
["ما مأساة الثاليدوميد بحسب الملخص؟","دواء مهدئ ومسكن بيع دون وصفة في أوروبا نحو عام 1960، وأدى استعماله أثناء الحمل إلى تشوهات خلقية خطيرة."],
["ما الدرس المستفاد من مأساة الثاليدوميد؟","ضرورة إثبات سلامة الدواء وفعاليته بدراسات كافية قبل التسويق، بما فيها تقييم المخاطر التي قد لا تكشفها الدراسات الأولية."],
["ما الفرق بين أدوية OTC وRx only؟","OTC تُصرف دون وصفة وتُعد مناسبة للعلاج الذاتي للحالات البسيطة؛ أما Rx only فتحتاج وصفة طبية وتشخيصاً."],
["ما المقصود بدستور الأدوية (Pharmacopoeia)؟","مرجع يحدد المعايير والمواصفات المطلوبة للمواد والأشكال الصيدلانية وطرق تحضيرها وفحصها."],
["ما أصل مصطلح Pharmacopoeia ومتى استُخدم أول مرة وفق الملخص؟","من اليونانية: Pharmakon بمعنى الدواء وPoiein بمعنى الصنع؛ وذكر الملخص أن أول استخدام للمصطلح كان في إيطاليا عام 1580م."],
["ما المونوغراف (Monograph)؟","الوحدة الأساسية في دستور الأدوية، وتحتوي معلومات شاملة عن المادة، وترتب المواد فيه أبجدياً."],
["ما المعلومات التي تتضمنها دساتير الأدوية؟","معلومات عن المواد الكيميائية والأدوية النباتية والحيوانية والأشكال الصيدلانية والجرعية، والسواغات المسموحة والمتوافقة ونسبها وطريقة استخدامها، والفحوص المطلوبة."],
["ما مثالان على الاختبارات الدستورية المذكورة؟","اختبار تجانس الوزن واختبار تجانس المحتوى."],
["ما أهم محتويات المونوغراف؟","الأسماء التجارية والمرادفة، الوزن الجزيئي، الصيغتان الكيميائيتان المجملة والبنيوية، الاسم الكيميائي، رقم التسجيل، النقاوة، التحذيرات، التعبئة والتخزين، تعيين الهوية، التنافرات، الاستطبابات، الجرعات، والآثار الجانبية."],
["ما اختصارا الدستور البريطاني والأمريكي؟","الدستور البريطاني BP، والدستور الأمريكي USP."],
["ما الدليل الوطني للأدوية الذي يذكر مع USP؟","NF، ويعتمد USP وNF معايير واختبارات للمواد الدوائية والمكونات والأشكال الصيدلانية."],
["ما أمثلة الدساتير الأخرى المذكورة؟","الدستور الفرنسي (French Codex)، الألماني، الدولي، الأوروبي، المصري، والياباني."],
["لماذا تعد مراجع USP وNF وثائق قانونية؟","لأنها تحدد معايير واختبارات وإجراءات إثبات الامتثال، ويجب أن تكون بياناتها واضحة ومحددة بدرجة عالية."],
["ما وظيفة الهاون ويد الهاون في الصيدلانيات؟","سحق المواد ومزج المساحيق، وقد يستعمل للاستحلاب أحياناً."],
["ما وظيفة الملق (Spatula)؟","يساعد في المزج."],
["ما أقدم وصفة طبية مكتوبة بحسب الملخص التاريخي؟","لوح غضاري سومري من الألفية الثالثة قبل الميلاد."],
["ماذا احتوت ورقة بردي إيبرس وفق الملخص؟","نحو 800 وصفة طبية وأكثر من 700 دواء، ويعود تاريخها إلى 1550 ق.م."],
["من كان يُعد الصيدلي الأول في المجتمعات القديمة؟","الرجل الحكيم أو المرأة الحكيمة في القبيلة."],
["ما أمثلة الممارسات العلاجية لدى الإنسان القديم المذكورة؟","استخدام الماء البارد لتخفيف الألم، والأوراق الطازجة، والطين لحماية الجروح، مع الاعتقاد القديم بأن بعض الأمراض سببها أرواح شريرة."],
["ما الشخصيتان اللتان ارتبطتا بإدخال النظرة العلمية إلى الطب والصيدلة؟","أبقراط وجالينوس."],
["بماذا ارتبط اسم جالينوس في الصيدلانيات؟","بالصيدلة الجالينوسية، ووضع الصيغ الصيدلانية ووصف طرق تركيب وتحضير أشكال صيدلانية عديدة."],
["متى وأين تأسست أول صيدلية بحسب الملخص؟","في القرن الثامن بمدينة بغداد في عهد الخليفة المنصور، ويربط الملخص ذلك بانفصال الصيدلة عن الطب."],
["ما الحدث الدوائي المرتبط بعام 1803م في الملخص؟","اكتشاف المورفين من الأفيون، ثم اكتشاف قلويدات مثل البيلوكاربين والكينين والكافئين."],
["متى أصبح البنسلين متاحاً تجارياً بحسب المحاضرة؟","عام 1944م."],
["ما المقصود بالمحلول الحقيقي الرائق؟","محلول خالٍ من الشوائب."],
["ما المبدأ الجزيئي لعملية الذوبان وفق المحاضرة الثانية؟","تُكسر روابط بين جزيئات المادة الصلبة وروابط بين جزيئات المذيب، ثم تتشكل روابط جديدة بين جزيئات المذاب والمذيب."],
["ما المراحل الثلاث لذوبان المادة الصلبة في المذيب؟","1) تكسير الروابط بين جزيئات المادة الصلبة. 2) تكسير الروابط بين جزيئات المذيب. 3) تشكل روابط بين جزيئات المادة وجزيئات المذيب."],
["ما طبيعة الطاقة في كسر الروابط القديمة وتشكيل الروابط الجديدة؟","كسر الروابط القديمة ماص للحرارة، أما تشكيل الروابط الجديدة بين المذيب والمذاب فناشر للحرارة."],
["متى يمكن تحضير الدواء بشكل محلول مائي؟","عندما تكون ذوبانيته في الوسط المائي عند pH محدد كافية لتأمين التركيز العلاجي المطلوب."],
["ماذا نفعل إذا كانت الذوبانية المائية متوسطة وأقل من التركيز العلاجي؟","يمكن الاستعانة بمذيبات مساعدة لتحسين ذوبانية المادة الفعالة."],
["ماذا يُفضّل إذا كانت الذوبانية قليلة جداً والفجوة كبيرة عن التركيز العلاجي؟","اختيار شكل صيدلاني آخر مثل المعلقات بدلاً من محاولة تحضيره كمحلول."],
["ما الفرق بين المحلول والمعلق؟","في المحلول تكون المكونات بحالة انحلال، أما في المعلق فتكون المادة الفعالة مبعثرة وغير ذائبة ضمن الطور السائل وقد تترسب مع الزمن."],
["ما العبارة التي توضع على عبوة المعلق؟","«رُج جيداً قبل الاستعمال» بسبب قابلية الجسيمات للترسب."],
["ما المذيبات المساعدة الأكثر استعمالاً بحسب المحاضرة؟","الغول، الغليسيرين، والبروبيلين غليكول."],
["ما الوصف المذكور للغليسيرين؟","يمتزج مع الماء، طعمه حلو، ويساعد على رفع اللزوجة."],
["ما الوصف المذكور للبروبيلين غليكول؟","طعمه قد يظهر لذعة قليلة."],
["ما الوصف المذكور للإيتانول؟","مذيب بطيء ومحِب للماء جداً وفق نص المحاضرة."],
["ما المذيبات التي وصفها الملف بأنها غير مناسبة للمستحضرات الداخلية بسبب سميتها؟","الأسيتون، ثنائي إيثيلين غليكول، والغول الأيزوبروبيلي؛ كما حذّر الملف من إدخال مذيبات سامة إلى المستحضرات الداخلية."],
["ما العوامل التي ذكرها الملف مؤثرة في ذوبانية المادة؟","الوزن الجزيئي، حجم الجزيئة، الخواص البلورية، نقطة الانصهار، والوظائف الكيميائية وطبيعة المجموعات المحبة للماء أو للدسم."],
["ما المقصود بمعدل الذوبان؟","عدد المليغرامات التي تذوب من المادة خلال وحدة زمن."],
["ما المقصود بالذوبانية وفق تعريف الملف؟","كمية المادة التي تذوب في حجم محدد من المذيب عند شروط محددة؛ وذكر الملف أنها ثابتة تتعلق بالمادة ووحدتها وزن/حجم."],
["كيف ترتبط نقطة الانصهار بالذوبانية بحسب المحاضرة الثانية؟","ذكر الملف أنه كلما ازدادت نقطة الانصهار انخفضت الذوبانية."],
["ما المقصود بمعامل التقاسم (Partition Coefficient)؟","مقياس يصف توزع المادة بين طورين مثل الماء والزيت."],
["ما الاستخدام المذكور لمعامل التقاسم؟","الاستدلال على ميل المادة للماء أو الزيت وإمكان عبورها الأغشية الخلوية؛ فكلما قلت محبة المادة للدسم ضعفت نفاذيتها بحسب النص."],
["ما ملاحظة الملف حول ذوبانية الأدوية الحمضية أو القلوية؟","غالباً ما تكون المواد الدوائية حمضية أو قلوية، وتعتمد ذوبانيتها على pH الوسط ودرجة التشرد."],
["كيف تؤثر درجة التشرد في الذوبانية بحسب المحاضرة؟","كلما ازدادت درجة التشرد ازدادت الذوبانية."],
["كيف يؤثر ارتفاع pH في تشرد الحمض الضعيف؟","يزداد الشكل المتشرد للحمض الضعيف بارتفاع pH، والعكس صحيح."],
["كيف يؤثر ارتفاع pH في تشرد الأساس الضعيف؟","يقل الشكل المتشرد للأساس الضعيف بارتفاع pH، والعكس صحيح."],
["ما تعريف Ka؟","ثابت تشرد الحمض الضعيف: Ka = [H⁺][A⁻]/[HA]."],
["ما العلاقة بين pKa وKa؟","pKa = −log Ka."],
["ما معادلة هندرسون–هاسلبالخ للحمض الضعيف كما وردت؟","pH − pKa = log([A⁻]/[HA])."],
["ما معادلة هندرسون–هاسلبالخ للأساس الضعيف كما وردت؟","pH − pKa = log([RNH₂]/[RNH₃⁺])."],
["متى تزداد ذوبانية المواد الحمضية وفق استنتاج المحاضرة؟","تزداد عند قيم pH أعلى من pKa."],
["متى تزداد ذوبانية المواد القلوية وفق استنتاج المحاضرة؟","تزداد عند قيم pH أقل من pKa."],
["ما الرمزان S وS₀ في فقرة الذوبانية؟","S ذوبانية الدواء الكلية، وS₀ الذوبانية الذاتية للشكل غير المتشرد (Intrinsic solubility)."],
["ما المحاليل الصيدلانية؟","مستحضرات سائلة تكون فيها المادة الفعالة والسواغات المضافة ذائبة في مذيب مناسب أو مزيج مذيبات ممتزجة."],
["ما المقصود بمصطلح Very soluble في جدول الذوبانية النسبي؟","يحتاج جزء واحد من المذاب إلى أقل من جزء واحد من المذيب."],
["ما مقدار المذيب اللازم لجزء واحد من المذاب في Freely soluble؟","من 1 إلى 10 أجزاء من المذيب."],
["ما مقدار المذيب اللازم لجزء واحد من المذاب في Soluble؟","من 10 إلى 30 جزءاً."],
["ما مقدار المذيب اللازم لجزء واحد من المذاب في Sparingly soluble؟","من 30 إلى 100 جزء."],
["ما مقدار المذيب اللازم لجزء واحد من المذاب في Slightly soluble؟","من 100 إلى 1000 جزء."],
["ما مقدار المذيب اللازم لجزء واحد من المذاب في Very slightly soluble؟","من 1000 إلى 10000 جزء."],
["متى توصف المادة بأنها Practically insoluble أو insoluble؟","عندما يلزم أكثر من 10000 جزء من المذيب لإذابة جزء واحد من المذاب."],
["كيف تصنف المحاليل بحسب نوعها في المحاضرة؟","شرابات (Syrups)، إكسير (Elixir)، أرواح (Spirits)، وصبغات (Tinctures)."],
["ما الشرابات (Syrups)؟","محاليل تحوي السكر."],
["ما الإكسير (Elixir)؟","محلول مائي غولي محلى بالسكر."],
["ما الأرواح (Spirits)؟","محاليل مواد عطرية في الغول."],
["ما الصبغات (Tinctures)؟","محاليل مواد كيميائية ذائبة في الغول أو في مزيج ماء وغول، وقد تُحضّر باستخلاص المواد الفعالة من أدوية خام."],
["ما المثال المذكور على صبغة تُحضّر بالاستخلاص؟","صبغة اليود المستعملة للتعقيم."],
["ما مزايا المحاليل الصيدلانية؟","سهولة التناول خاصة للأطفال وكبار السن، وإمكان تقنيع الطعم المر، وكون المادة الفعالة ذائبة وجاهزة للامتصاص؛ ويذكر الملف توافراً حيوياً أكبر للأشكال السائلة مقارنة بالصلبة."],
["ما المقصود بالتوافر الحيوي بحسب المحاضرة؟","قياس سرعة وصول المادة الفعالة إلى الدوران العام."],
["ما عيوب المحاليل الصيدلانية الفموية؟","لا تناسب المواد غير الثابتة في الأوساط المائية، وقد تمنع الذوبانية الضعيفة تحضير الدواء كمحلول، كما أن شحنها مكلف وقد يكون حملها عبئاً للمريض."],
["ما طرق تقنيع الطعم المر المذكورة؟","استخدام السيكلوديكسترين لتكوين معقد انضمامي، إضافة المنكهات، بعثرة المادة الفعالة ضمن سلاسل بوليمرية لا تذوب في pH اللعاب، أو استخدام مساعد منكّه يخدر الحليمات الذوقية بكميات قليلة جداً."],
["كيف يعمل السيكلوديكسترين في تقنيع الطعم؟","يدخل جزء من المادة الفعالة في جوف المركب الحلقي فيتكون معقد انضمامي."],
["ما وظيفة البوليمرات المستخدمة لتقنيع الطعم؟","تبعثر جزيئات المادة الفعالة ذات الطعم المر، وتكون غير ذائبة في pH اللعاب وتذوب عند pH خارج الفم بحسب المحاضرة."],
["ما المثال المذكور على مساعد منكّه يخدر الحليمات الذوقية؟","الكلوروفورم، بكميات قليلة جداً وفق النص."],
["ما المذيب المفضل في معظم المستحضرات الفموية والعينية بحسب المحاضرة؟","الماء."],
["لماذا لا يُستخدم ماء الحنفية في تحضير الأشكال الصيدلانية السائلة؟","لاحتمال حدوث تنافرات كيميائية بين المواد الصلبة الموجودة فيه والمواد المضافة."],
["ما أنواع الماء أو طرق الحصول على الماء المذكورة؟","الماء المقطر، ويمكن الحصول على الماء بالتقطير أو التناضح العكسي أو التبادل الشاردي."],
["ما الماء المستخدم في معظم الأشكال الصيدلانية المائية غير الحقنية وفق الملف؟","الماء المنقى (Purified Water)."],
["ما الماء المستخدم في تحضير المستحضرات الحقنية؟","ماء معد للحقن (Water for Injection – WFI)."],
["ما الحد المذكور للشوائب الصلبة في الماء المنقى وفق النص؟","ألا تزيد نسبة المواد الصلبة عن 0.001%، وفسرها الملف بأنها 1 mg في 100 mL."],
["ما المواد الإضافية التي قد تحتويها المحاليل الفموية؟","منكهات وملونات لتحسين القبول، ومثبتات للحفاظ على الثبات الفيزيائي والكيميائي، ومواد حافظة لمنع نمو الأحياء الدقيقة."],
["ما حجم ملعقة الشاي وملعقة الطعام المذكورين لقياس الجرعات؟","ملعقة الشاي 5 mL، وملعقة الطعام 15 mL."],
["ما المثال المذكور لمحلول فموي يعطى بحجم كبير؟","شراب سترات المغنزيوم، وذكر الملف أن جرعته حسب دستور الأدوية الأمريكي 200 mL."],
["كيف يمكن أن تُعطى بعض الشرابات الفموية غير المأخوذة بالملعقة؟","على شكل قطرات باستخدام قطارة معايرة يجهزها المصنع."],
["ما تعريف الشرابات؟","مستحضرات مائية مركزة من السكر أو مادة بديلة للسكر، سواء أضيفت مادة منكهة أو مادة دوائية أم لم تُضف."],
["ما أمثلة الشرابات المنكهة المذكورة؟","شراب الكرز، وشراب البرتقال، وشراب الكاكاو."],
["ما تركيز السكروز في الشراب البسيط وفق دستور الأدوية الأمريكي كما ورد؟","85% سكروز، وذكر الملف أنه لا يحتاج إلى عامل حافظ."],
["ما السكر الأكثر استعمالاً في تحضير الشرابات؟","السكروز."],
["ما المواد التي يمكن أن تستبدل السكروز كلياً أو جزئياً في بعض الحالات؟","السوربيتول، أو مواد ذات طعم حلو مثل الغليسيرين والبروبيلين غليكول."],
["ما البديل المذكور للحصول على لزوجة مماثلة للشراب البسيط؟","استخدام ميثيل سليلوز أو هيدروكسي إيثيل سليلوز لرفع اللزوجة، ثم إضافة السكّارين كعامل محلي."],
["كيف تُحضّر محاليل مرضى السكري بحسب النص؟","تُستبدل المواد المولدة للسكر بمواد غير مولدة للسكر؛ وذكر النص ميثيل سليلوز وهيدروكسي إيثيل سليلوز ضمن البدائل."],
["ما وظيفة ميثيل سليلوز وهيدروكسي إيثيل سليلوز في الشراب البديل؟","عاملان رافعان للزوجة بحسب المحاضرة."],
["ما أمثلة العوامل المحلية الصناعية المذكورة؟","السكّارين والأسبارتام."],
["ما المواد الحافظة المضادة للجراثيم وتركيزاتها المذكورة؟","حمض البنزويك 0.1–0.2%، وبنزوات الصوديوم 0.1–0.2%."],
["ما البارابينات المذكورة كمواد حافظة؟","Methylparaben وPropylparaben وButylparaben."],
["ما النسبة المذكورة لمزيج methylparaben وpropylparaben؟","ذكر الملف نسبة 9:1 وتركيزاً بين 0.001–0.2%؛ تُراجع كتابة المجال في المصدر عند اعتماد الرقم."],
["ما الصفات المطلوبة في العامل الحافظ؟","طيف واسع مضاد للميكروبات، تأثير على الجراثيم سلبية وإيجابية الغرام والفطور، وثبات طوال فترة حفظ الدواء."],
["ما MIC؟","Minimum Inhibitory Concentration؛ التركيز المثبط الأدنى لنمو الأحياء الدقيقة."],
["على ماذا تعتمد فعالية العامل الحافظ بحسب المحاضرة؟","على وجود الشكل المناسب منه في المحلول بالتركيز اللازم لتثبيط نمو الميكروبات."],
["كيف قد يؤثر البوليمر المحب للماء في فعالية المادة الحافظة؟","قد يتفاعل معها أو يثبتها، فيقل الجزء المتاح منها لأداء وظيفة الحفظ."],
["كيف قد تؤثر المذيلات في فعالية المادة الحافظة؟","قد توزع المادة الحافظة بين الوسط والمذيلات، فيتغير تركيز الشكل المتاح لتثبيط الميكروبات."],
["ما المذيلات (Micelles) بحسب وصف المحاضرة؟","تجمعات من مواد فعالة سطحياً، تتألف من رؤوس محبة للماء وذيول كارهة للماء، وتخفض التوتر السطحي بين سائلين."],
["ما المقصود بالتركيز الحرج لتشكل المذيلات؟","التركيز الذي تبدأ عنده جزيئات المادة الفعالة سطحياً بالتجمع لتشكيل مذيلات؛ ورد في النص بوصفه التركيز الموافق لأدنى قيمة للتوتر السطحي."],
["لماذا قد تكون فعالية حمض البنزويك وحمض السوربيك مرتبطة بـpH الوسط؟","لأن التأثير المضاد للميكروبات يعود إلى الشكل غير المتشرد؛ وهذا الشكل يعبر غشاء الخلية الميكروبية ثم يتشرد داخل السيتوبلازم ويؤثر في pH الداخلي."],
["ما أمثلة المواد المنكهة المذكورة؟","الفانيليا، زيت البرتقال، وزيت النعناع؛ وذكر الملف أن الغول يُستخدم لإذابة الزيوت الطيارة."],
["ما العلاقة المذكورة بين اللون والنكهة؟","يُختار اللون بما يتناسب مع النكهة، مثل الأخضر مع النعناع والبني مع الشوكولا."],
["ما الطرق المذكورة لتحسين ذوبانية المواد الفعالة؟","اختيار الشكل الملحي الأنسب، تعديل pH مع استخدام الوقاء للمحافظة عليه، استخدام مذيبات مشاركة مثل الغليسيرين، استخدام عوامل فعالة على السطح، وتشكيل معقدات."],
["ما استعمال المذيلات في المحاليل؟","زيادة انحلالية المادة الفعالة."],
["ما استعمال المذيلات في المعلقات بحسب الملاحظة؟","زيادة ثبات المعلق عن طريق تشكيل المعلق المتردد كما ورد في النص."],
["ما استعمال المواد الفعالة سطحياً في المستحلبات؟","تساعد على امتزاج الطور الدهني والطور المائي معاً."],
["ما التناقض الذي ينبغي الانتباه إليه بين المصادر المرفقة حول سرعة انحلال الشكل البلوري وعديم الشكل؟","المحاضرة الأولى وملخص المساحيق يذكران أن عديم الشكل أسرع انحلالاً، بينما صفحة 5 من ملف المحاضرة الثانية تذكر أن معدل الذوبان في الحالة البلورية أعلى؛ لذلك لا يُحسم هذا التعارض من الملفات وحدها ويحتاج مراجعة المحاضِرة."],
["ما ملاحظة يجب الانتباه إليها عند قراءة نسب المواد الدوائية في المحاضرة الأولى؟","وردت النسب: 5% مواد متذبذبة و20% حموض ضعيفة و75% أسس ضعيفة في موضع، بينما ملخص المساحيق يذكر 5% و20% و70%؛ يوجد اختلاف في النسبة ويجب مراجعة المصدر الدراسي المعتمد."]
]},
{id:"physical",name:"الكيمياء الفيزيائية",desc:"الحركية الكيميائية – المحاضرتان 7 و8 والمسائل",cards:[
["ما موضوع الحركية الكيميائية؟","دراسة سرعة التفاعلات الكيميائية والعوامل المؤثرة فيها وآلية حدوثها."],
["ما المقصود بسرعة التفاعل؟","معدل تغير تركيز أحد المتفاعلات أو النواتج بالنسبة للزمن."],
["ما قانون السرعة العام؟","للتفاعل aA + bB → نواتج: v = k[A]^m[B]^n، وتحدد الرتب تجريبياً."],
["ما المقصود بثابت السرعة k؟","ثابت تناسب في قانون السرعة، وتتغير قيمته بتغير درجة الحرارة وطبيعة التفاعل."],
["هل رتبة التفاعل تساوي معاملات المعادلة دائماً؟","لا؛ تُحدد رتبة التفاعل تجريبياً، ولا تساوي المعاملات إلا في حالات خاصة مثل الخطوة الأولية."],
["ما الرتبة الكلية للتفاعل؟","مجموع أسس تراكيز المواد في قانون السرعة."],
["ما قانون السرعة للتفاعل من الرتبة الصفرية؟","v = k، وتكامل القانون: [A]t = [A]0 − kt."],
["ما وحدة k في التفاعل الصفري؟","تركيز/زمن، مثل mol·L⁻¹·s⁻¹."],
["ما قانون السرعة المتكامل للرتبة الأولى؟","ln([A]0/[A]t) = kt، أو ln[A]t = ln[A]0 − kt."],
["ما وحدة k للرتبة الأولى؟","مقلوب الزمن، مثل s⁻¹."],
["ما قانون نصف العمر للرتبة الأولى؟","t½ = 0.693/k، ولا يعتمد على التركيز الابتدائي."],
["ما قانون السرعة المتكامل للرتبة الثانية عندما v=k[A]²؟","1/[A]t = 1/[A]0 + kt."],
["ما وحدة k للرتبة الثانية؟","مقلوب التركيز مضروباً بالزمن، مثل L·mol⁻¹·s⁻¹."],
["كيف يتغير نصف العمر في التفاعل الصفري؟","يتناسب طردياً مع التركيز الابتدائي: t½ = [A]0/(2k)."],
["ما نصف العمر للرتبة الثانية عندما v=k[A]²؟","t½ = 1/(k[A]0)."],
["كيف نحدد رتبة التفاعل بيانياً؟","نختبر الخطية: [A] مقابل الزمن للرتبة صفر، ln[A] مقابل الزمن للأولى، و1/[A] مقابل الزمن للثانية."],
["ما ميل منحنى الرتبة الأولى عند رسم ln[A] مقابل الزمن؟","الميل = −k."],
["ما ميل منحنى الرتبة الثانية عند رسم 1/[A] مقابل الزمن؟","الميل = +k."],
["ما المقصود بنصف العمر؟","الزمن اللازم لانخفاض تركيز المتفاعل إلى نصف قيمته الابتدائية."],
["كيف تؤثر زيادة درجة الحرارة غالباً في سرعة التفاعل؟","تزيد سرعة التفاعل غالباً بسبب زيادة نسبة الجزيئات القادرة على تجاوز طاقة التنشيط."],
["ما معادلة أرينيوس؟","k = A e^(−Ea/RT)، حيث Ea طاقة التنشيط وT درجة الحرارة المطلقة."],
["ما المقصود بطاقة التنشيط؟","الحد الأدنى من الطاقة اللازمة لتصل الجزيئات إلى الحالة الانتقالية وتتمكن من التفاعل."],
["كيف يؤثر العامل الحفاز؟","يوفر مساراً بديلاً بطاقة تنشيط أقل، فيزيد سرعة التفاعل دون أن يُستهلك كلياً."],
["هل يغير العامل الحفاز ثابت الاتزان؟","لا يغير موضع الاتزان أو ثابت الاتزان؛ يسرّع الوصول إلى الاتزان في الاتجاهين."],
["ما المقصود بالتفاعل من الرتبة الكاذبة؟","تفاعل رتبته الظاهرية أقل من رتبته الحقيقية بسبب وجود أحد المتفاعلات بزيادة كبيرة فيبقى تركيزه شبه ثابت."],
["لماذا قد نستخدم اللوغاريتم في مسائل الرتبة الأولى؟","لأن القانون المتكامل يتضمن ln([A]0/[A]t)، ويمكن منه حساب k أو الزمن أو التركيز."],
["إذا تضاعف تركيز A في تفاعل سرعته v=k[A]²، ماذا يحدث للسرعة؟","تزداد أربعة أضعاف لأن السرعة تتناسب مع مربع التركيز."],
["إذا تضاعف تركيز A في تفاعل من الرتبة الأولى، ماذا يحدث للسرعة؟","تتضاعف السرعة."]
]},

["ما الكحول الثانوي؟","كحول ترتبط فيه ذرة الكربون الحاملة لـ OH بذرتي كربون."],

function save(){localStorage.setItem(KEY,JSON.stringify(state));stats()}
function stats(){$("total").textContent=new Set([...state.known,...state.wrong]).size;$("known").textContent=state.known.length;$("wrong").textContent=state.wrong.length}
function renderSubjects(){$("subjects").innerHTML=DATA.map(d=>'<div class="subject" onclick="openDeck(\''+d.id+'\')"><h3>'+d.name+'</h3><div class="muted">'+d.desc+'</div><div class="count">'+d.cards.length+' بطاقة · اضغط للفتح</div></div>').join('')+["الحاسوب","اللغة الإنجليزية","اللغة العربية"].map(n=>'<div class="subject soon"><h3>'+n+'</h3><div class="muted">قريباً</div></div>').join('')}
function goHome(){$("home").classList.remove("hidden");$("study").classList.add("hidden");current=null}
function openDeck(id){current=DATA.find(d=>d.id===id);index=0;onlyWrong=false;$("home").classList.add("hidden");$("study").classList.remove("hidden");$("crumb").textContent=current.name;$("deckTitle").textContent=current.name;$("deckMeta").textContent=current.desc;$("mistakesBtn").textContent="مراجعة الأخطاء فقط";renderCard()}
function toggleMistakes(){onlyWrong=!onlyWrong;index=0;$("mistakesBtn").textContent=onlyWrong?"عرض كل البطاقات":"مراجعة الأخطاء فقط";renderCard()}
function getCards(){return onlyWrong?current.cards.filter((c,i)=>state.wrong.includes(current.id+":"+i)):current.cards}
function renderCard(){deckCards=getCards();if(index>=deckCards.length)index=deckCards.length-1;if(index<0)index=0;
$("position").textContent=deckCards.length?("البطاقة "+(index+1)+" من "+deckCards.length):"لا توجد بطاقات أخطأت بها في هذه المادة.";
$("progress").style.width=deckCards.length?((index+1)/deckCards.length*100)+"%":"0%";
if(!deckCards.length){$("cardArea").innerHTML='<div class="empty">ممتاز! لا توجد أخطاء مسجلة هنا حالياً.</div>';$("reveal").disabled=true;$("markActions").classList.add("hidden");return}
$("reveal").disabled=false;visible=false;const c=deckCards[index];$("cardArea").innerHTML='<div class="cardq"><div class="muted">السؤال</div><div class="question">'+c[0]+'</div><div class="answer" id="answer">'+c[1]+'</div></div>';$("reveal").textContent="إظهار الإجابة";$("markActions").classList.add("hidden");$("prev").disabled=index===0;$("next").disabled=index===deckCards.length-1}
function reveal(){if(!deckCards.length)return;visible=true;$("answer").style.display="block";$("reveal").textContent="الإجابة ظاهرة";$("markActions").classList.remove("hidden")}
function mark(ok){const c=deckCards[index],original=current.cards.indexOf(c),key=current.id+":"+original;state.known=state.known.filter(x=>x!==key);state.wrong=state.wrong.filter(x=>x!==key);(ok?state.known:state.wrong).push(key);save();if(onlyWrong&&!ok){renderCard()}else if(index<deckCards.length-1){index++;renderCard()}else{renderCard()}}
function move(n){index=Math.max(0,Math.min(deckCards.length-1,index+n));renderCard()}
function resetDeck(){const ids=current.cards.map((c,i)=>current.id+":"+i);state.known=state.known.filter(x=>!ids.includes(x));state.wrong=state.wrong.filter(x=>!ids.includes(x));save();index=0;onlyWrong=false;$("mistakesBtn").textContent="مراجعة الأخطاء فقط";renderCard()}
renderSubjects();stats();
</script></body></html>
